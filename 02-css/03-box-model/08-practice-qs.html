<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Questions</title>
    <style>
        /* Practice styling based on previous topics */
        .card {
            width: 250px;
            padding: 20px;
            margin: 30px auto; /* Centers the card */
            border: 2px solid #333;
            border-radius: 10px;
            background-color: #f4f4f4;
            text-align: center;
        }

        .card button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Box Model Practice</h1>
    <div class="card">
        <h2>Profile Card</h2>
        <p>Using width, padding, margin, and border-radius.</p>
        <button>Follow</button>
    </div>
</body>
</html>
