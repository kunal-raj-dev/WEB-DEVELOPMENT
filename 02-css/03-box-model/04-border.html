<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Property</title>
    <style>
        .solid-border {
            border: 5px solid red;
            margin-bottom: 20px;
            padding: 10px;
        }
        
        .dashed-border {
            border-width: 3px;
            border-style: dashed;
            border-color: green;
            margin-bottom: 20px;
            padding: 10px;
        }

        .mixed-border {
            border-top: 5px solid blue;
            border-bottom: 5px dotted orange;
            border-left: 2px dashed purple;
            border-right: 2px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Border Property Demo</h1>
    <div class="solid-border">Solid Red Border</div>
    <div class="dashed-border">Dashed Green Border</div>
    <div class="mixed-border">Mixed Border Styles</div>
</body>
</html>
