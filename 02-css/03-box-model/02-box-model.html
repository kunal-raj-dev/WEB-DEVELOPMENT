<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .box {
            /* The CSS Box Model consists of: content, padding, border, and margin */
            width: 200px; /* Content width */
            padding: 20px; /* Space inside the border */
            border: 5px solid black; /* The border itself */
            margin: 30px; /* Space outside the border */
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <h1>Box Model Demo</h1>
    <div class="box">
        This is a box. Inspect it in your browser's Developer Tools to see the Box Model in action!
    </div>
</body>
</html>
