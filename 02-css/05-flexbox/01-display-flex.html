<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 - What is Flexbox & Display Flex</title>
    <link rel="stylesheet" href="01-display-flex.css">
</head>
<body>
    <h1>01 - What is Flexbox & Display Flex</h1>
    <p class="description">Flexbox turns a parent element into a Flex Container and its immediate children into Flex Items.</p>

    <section>
        <h2>Normal Block Flow (Without Flexbox)</h2>
        <div class="block-container">
            <div class="box">Box 1</div>
            <div class="box">Box 2</div>
            <div class="box">Box 3</div>
        </div>
    </section>

    <section>
        <h2>Flexbox Layout (display: flex)</h2>
        <div class="flex-container">
            <div class="box">Flex Item 1</div>
            <div class="box">Flex Item 2</div>
            <div class="box">Flex Item 3</div>
        </div>
    </section>
</body>
</html>
