<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07 - Align Self</title>
    <link rel="stylesheet" href="07-align-self.css">
</head>
<body>
    <h1>07 - Align Self</h1>
    <p>The parent container has <code>align-items: center</code>. Individual flex items override this alignment using <code>align-self</code>.</p>

    <div class="container">
        <div class="box self-start">align-self: flex-start</div>
        <div class="box self-center">align-self: center</div>
        <div class="box self-end">align-self: flex-end</div>
        <div class="box self-stretch">align-self: stretch</div>
    </div>
</body>
</html>
